name: healing_tabs
description: "云遥 App — 四 Tab 根壳（首页 / 睡眠 / 冥想 / 戒指）"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.11.0
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_remote_config: ^6.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  audio_session: ^0.1.25
  just_audio: ^0.9.46
  shared_preferences: ^2.5.5
  hugeicons: ^1.1.7
  sleep_stages_chart: ^1.0.0
  permission_handler: ^11.0.0
  # 蓝牙（云程戒指 SDK）
  yc_product_plugin:
    git:
      url: https://gitee.com/yucheng_3/yc_product_plugin.git
      path: code/
      ref: 6201bd88c61c8258411cb9e5b8fe7b9de4d2dcc7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

