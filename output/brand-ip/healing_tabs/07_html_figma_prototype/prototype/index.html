<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Healing Tabs · 四 Tab 原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="prototype" aria-label="疗愈 App 四 Tab 原型">
    <section class="mobile-prototype" data-prototype tabindex="0">
      <article class="screen is-active" data-screen="home" aria-label="首页">
        <img class="screen-image" src="assets/home-tab-v2.png" alt="首页界面">
      </article>

      <article class="screen" data-screen="sleep" aria-label="睡眠" hidden>
        <img class="screen-image" src="assets/sleep-tab-v1.png" alt="睡眠界面">
      </article>

      <article class="screen" data-screen="meditation" aria-label="冥想" hidden>
        <img class="screen-image" src="assets/meditation-tab-v2.png" alt="冥想界面">
      </article>

      <article class="screen" data-screen="sound" aria-label="声音" hidden>
        <img class="screen-image" src="assets/sound-tab-v1.png" alt="声音界面">
      </article>

      <nav class="tab-hotspots" aria-label="主导航">
        <button type="button" class="hotspot is-active" data-tab="home" aria-current="page" aria-label="打开首页"></button>
        <button type="button" class="hotspot" data-tab="sleep" aria-label="打开睡眠"></button>
        <button type="button" class="hotspot" data-tab="meditation" aria-label="打开冥想"></button>
        <button type="button" class="hotspot" data-tab="sound" aria-label="打开声音"></button>
      </nav>

      <div class="action-hotspots" aria-label="页面操作">
        <button type="button" class="action action-search" data-action="搜索" aria-label="搜索"></button>
        <button type="button" class="action action-add" data-action="添加" aria-label="添加"></button>
        <button type="button" class="action action-profile" data-action="能量球" aria-label="能量球"></button>
        <button type="button" class="action action-play" data-action="播放" aria-label="播放"></button>
      </div>

      <p class="toast" role="status" aria-live="polite" hidden></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
