name: app_template
description: "App template source (minimal dual-platform Flutter app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  animations: ^3.0.0
  dio: ^5.11.0
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_remote_config: ^6.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  forui: ^0.25.0
  get: ^4.7.3
  lottie: ^3.5.1
  rive: ^0.14.11
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  umeng_common_sdk: ^1.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/logo.png
